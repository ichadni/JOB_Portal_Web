<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password - JobPortal</title>
  <link rel="stylesheet" href="auth.css">
</head>
<body>

<header class="site-header">
  <div class="container header-inner">
    <a href="../index.html" class="logo">HireWay</a>
    <nav class="nav">
      <a href="login.html">Login</a>
      <a href="register.html">Register</a>
    </nav>
  </div>
</header>

<div class="auth-bg">
  <div class="login-container">
    <div class="login-form">
      <h2>Reset Password</h2>
      <p>Enter your email to receive a password reset code</p>
      <p id="resetError" class="error"></p>
      <p id="resetLoading" class="loading"></p>

      <form id="resetForm">
        <!-- Step 1: Email -->
        <div id="emailSection">
          <div class="form-group">
            <label>Email</label>
            <input type="email" id="resetEmail" name="email" required />
          </div>
          <button type="button" id="sendResetCodeBtn">Send Reset Code</button>
        </div>

        <!-- Step 2: Code (hidden initially) -->
        <div id="codeSection" style="display: none;">
          <div class="form-group">
            <label>Reset Code</label>
            <input type="text" id="resetCode" placeholder="Enter 6-digit code" />
            <small style="color: #666;">Check your email for the code</small>
          </div>
        </div>

        <!-- Step 3: New Password (hidden initially) -->
        <div id="passwordSection" style="display: none;">
          <div class="form-group">
            <label>New Password</label>
            <input type="password" id="newPassword" placeholder="Enter new password" />
          </div>
          <div class="form-group">
            <label>Confirm Password</label>
            <input type="password" id="confirmPassword" placeholder="Confirm new password" />
          </div>
          <button type="button" id="resetPasswordBtn">Reset Password</button>
        </div>
      </form>

      <p>Remember your password? <a href="login.html">Sign In</a></p>
    </div>
  </div>
</div>

<script src="reset.js" defer></script>
</body>
</html>
