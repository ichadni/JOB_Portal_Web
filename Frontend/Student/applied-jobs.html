<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Applied Jobs</title>
  <style>
    /* ============================================
       GOOGLE FONTS
       ============================================ */
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');

    /* ============================================
       CSS VARIABLES
       ============================================ */
    :root {
      --primary: #6C2BD9;
      --primary-dark: #4A1A8A;
      --primary-light: #8B5CF6;
      --primary-gradient: linear-gradient(135deg, #6C2BD9, #8B5CF6);
      --secondary: #1E293B;
      --bg: #F8FAFC;
      --card-bg: #FFFFFF;
      --text-primary: #0F172A;
      --text-secondary: #475569;
      --text-muted: #94A3B8;
      --border: #E2E8F0;
      --shadow: 0 4px 24px rgba(108, 43, 217, 0.08);
      --shadow-hover: 0 12px 40px rgba(108, 43, 217, 0.15);
      --radius: 16px;
      --radius-sm: 10px;
      --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* ============================================
       RESET & BASE
       ============================================ */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      color: var(--text-primary);
      display: flex;
      min-height: 100vh;
      line-height: 1.6;
    }

    /* ============================================
       SCROLLBAR
       ============================================ */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: var(--bg);
    }
    ::-webkit-scrollbar-thumb {
      background: var(--primary-light);
      border-radius: 10px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: var(--primary);
    }

    /* ============================================
       SIDEBAR
       ============================================ */
    .sidebar {
      width: 260px;
      background: var(--secondary);
      color: white;
      padding: 28px 0;
      height: 100vh;
      position: fixed;
      top: 0;
      left: 0;
      overflow-y: auto;
      z-index: 100;
      display: flex;
      flex-direction: column;
    }

    .sidebar .logo {
      font-size: 22px;
      font-weight: 800;
      padding: 0 24px 28px 24px;
      border-bottom: 1px solid rgba(255,255,255,0.06);
      letter-spacing: -0.5px;
    }

    .sidebar .logo span {
      background: var(--primary-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .sidebar .logo .dot {
      color: var(--primary-light);
      -webkit-text-fill-color: var(--primary-light);
    }

    .sidebar .nav-section {
      padding: 20px 0 8px 24px;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: rgba(255,255,255,0.3);
      font-weight: 600;
    }

    .sidebar a {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 24px;
      color: rgba(255,255,255,0.6);
      text-decoration: none;
      transition: var(--transition);
      font-size: 14px;
      font-weight: 500;
      border-left: 3px solid transparent;
      margin: 2px 12px;
      border-radius: var(--radius-sm);
    }

    .sidebar a .icon {
      font-size: 18px;
      width: 24px;
      text-align: center;
    }

    .sidebar a:hover {
      background: rgba(255,255,255,0.05);
      color: white;
    }

    .sidebar a.active {
      background: rgba(108, 43, 217, 0.2);
      color: white;
      border-left-color: var(--primary-light);
    }

    .sidebar .sidebar-footer {
      margin-top: auto;
      padding: 20px 24px;
      border-top: 1px solid rgba(255,255,255,0.06);
    }

    .sidebar .logout-btn {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
      padding: 12px 16px;
      background: rgba(239, 68, 68, 0.1);
      border: none;
      color: #F87171;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: var(--transition);
      border-radius: var(--radius-sm);
      font-family: 'Inter', sans-serif;
    }

    .sidebar .logout-btn:hover {
      background: rgba(239, 68, 68, 0.2);
      color: #FCA5A5;
    }

    /* ============================================
       MAIN CONTENT
       ============================================ */
    .main-content {
      margin-left: 260px;
      padding: 32px 40px;
      flex: 1;
      width: calc(100% - 260px);
      min-height: 100vh;
    }

    /* ============================================
       TOP NAVBAR
       ============================================ */
    .top-navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 32px;
      background: var(--card-bg);
      padding: 16px 24px;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
    }

    .top-navbar .page-title h1 {
      font-size: 22px;
      font-weight: 700;
      color: var(--text-primary);
      letter-spacing: -0.3px;
    }

    .top-navbar .page-title p {
      font-size: 14px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .top-navbar .navbar-right {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .top-navbar .user-info {
      display: flex;
      align-items: center;
      gap: 10px;
      padding-right: 16px;
      border-right: 1px solid var(--border);
    }

    .top-navbar .user-info .avatar {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: var(--primary-gradient);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 600;
      font-size: 16px;
    }

    .top-navbar .user-info .name {
      font-weight: 600;
      font-size: 14px;
      color: var(--text-primary);
    }

    .logout-top-btn {
      background: var(--primary);
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      transition: var(--transition);
      font-family: 'Inter', sans-serif;
    }

    .logout-top-btn:hover {
      background: var(--primary-dark);
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(108, 43, 217, 0.3);
    }

    /* ============================================
       STATS BAR
       ============================================ */
    .stats-bar {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 16px;
      margin-bottom: 28px;
    }

    .stat-item {
      background: var(--card-bg);
      padding: 16px 20px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
    }

    .stat-item .stat-label {
      font-size: 12px;
      color: var(--text-muted);
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .stat-item .stat-value {
      font-size: 22px;
      font-weight: 700;
      color: var(--text-primary);
      margin-top: 4px;
    }

    .stat-item .stat-value .highlight {
      color: var(--primary);
    }

    /* ============================================
       CARD
       ============================================ */
    .card {
      background: var(--card-bg);
      border-radius: var(--radius);
      padding: 24px 28px;
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
      transition: var(--transition);
      overflow: hidden;
    }

    .card:hover {
      box-shadow: var(--shadow-hover);
    }

    .card .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 18px;
    }

    .card .card-header h3 {
      font-size: 16px;
      font-weight: 600;
      color: var(--text-primary);
    }

    .card .card-header .badge {
      background: var(--primary-gradient);
      color: white;
      padding: 4px 14px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
    }

    /* ============================================
       TABLE
       ============================================ */
    .table-wrapper {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
    }

    thead {
      background: var(--bg);
      border-radius: var(--radius-sm);
    }

    thead th {
      padding: 14px 16px;
      text-align: left;
      font-weight: 600;
      color: var(--text-secondary);
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      border-bottom: 2px solid var(--border);
    }

    tbody td {
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
      color: var(--text-secondary);
      font-size: 14px;
      vertical-align: middle;
    }

    tbody tr {
      transition: var(--transition);
    }

    tbody tr:hover {
      background: rgba(108, 43, 217, 0.03);
    }

    tbody tr:last-child td {
      border-bottom: none;
    }

    tbody .job-title {
      font-weight: 600;
      color: var(--text-primary);
    }

    tbody .company-name {
      color: var(--primary);
      font-weight: 500;
    }

    /* ===== STATUS BADGES ===== */
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 14px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      text-transform: capitalize;
    }

    .status-badge .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      display: inline-block;
    }

    .status-pending {
      background: #FEF3C7;
      color: #92400E;
    }
    .status-pending .dot {
      background: #F59E0B;
    }

    .status-reviewed {
      background: #DBEAFE;
      color: #1E40AF;
    }
    .status-reviewed .dot {
      background: #3B82F6;
    }

    .status-shortlisted {
      background: #D1FAE5;
      color: #065F46;
    }
    .status-shortlisted .dot {
      background: #10B981;
    }

    .status-interview {
      background: #EDE9FE;
      color: #5B21B6;
    }
    .status-interview .dot {
      background: #7C3AED;
    }

    .status-accepted {
      background: #D1FAE5;
      color: #065F46;
    }
    .status-accepted .dot {
      background: #059669;
    }

    .status-rejected {
      background: #FEE2E2;
      color: #991B1B;
    }
    .status-rejected .dot {
      background: #EF4444;
    }

    /* ============================================
       EMPTY STATE
       ============================================ */
    .empty-state {
      text-align: center;
      padding: 60px 20px;
    }

    .empty-state .icon {
      font-size: 56px;
      display: block;
      margin-bottom: 16px;
    }

    .empty-state h3 {
      font-size: 20px;
      color: var(--text-primary);
      margin-bottom: 8px;
    }

    .empty-state p {
      color: var(--text-muted);
      font-size: 15px;
    }

    .empty-state .btn-browse {
      display: inline-block;
      margin-top: 16px;
      padding: 12px 28px;
      background: var(--primary-gradient);
      color: white;
      border: none;
      border-radius: var(--radius-sm);
      font-size: 14px;
      font-weight: 600;
      text-decoration: none;
      transition: var(--transition);
      font-family: 'Inter', sans-serif;
      cursor: pointer;
    }

    .empty-state .btn-browse:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(108, 43, 217, 0.3);
    }

    /* ============================================
       RESPONSIVE
       ============================================ */
    @media (max-width: 1024px) {
      .main-content {
        padding: 24px 28px;
      }
    }

    @media (max-width: 768px) {
      .sidebar {
        width: 72px;
        padding: 16px 0;
      }
      .sidebar .logo {
        font-size: 18px;
        padding: 0 12px 20px 12px;
        text-align: center;
      }
      .sidebar .logo span {
        display: none;
      }
      .sidebar .logo .dot {
        display: none;
      }
      .sidebar .nav-section {
        display: none;
      }
      .sidebar a {
        padding: 12px;
        margin: 2px 6px;
        justify-content: center;
        font-size: 0;
        border-radius: var(--radius-sm);
      }
      .sidebar a .icon {
        font-size: 20px;
        width: auto;
      }
      .sidebar a.active {
        border-left: none;
        background: rgba(108, 43, 217, 0.2);
      }
      .sidebar .sidebar-footer {
        padding: 12px;
      }
      .sidebar .logout-btn {
        justify-content: center;
        padding: 12px;
        font-size: 0;
      }
      .sidebar .logout-btn .icon {
        font-size: 20px;
      }

      .main-content {
        margin-left: 72px;
        padding: 16px 18px;
        width: calc(100% - 72px);
      }

      .top-navbar {
        flex-direction: column;
        align-items: flex-start;
        gap: 12px;
        padding: 16px 18px;
      }
      .top-navbar .navbar-right {
        width: 100%;
        justify-content: space-between;
      }

      .stats-bar {
        grid-template-columns: 1fr 1fr;
      }

      .card {
        padding: 16px 18px;
      }

      thead th,
      tbody td {
        padding: 10px 12px;
        font-size: 13px;
      }

      .status-badge {
        font-size: 11px;
        padding: 4px 10px;
      }
    }

    @media (max-width: 480px) {
      .stats-bar {
        grid-template-columns: 1fr;
      }

      table {
        font-size: 13px;
      }

      thead th,
      tbody td {
        padding: 8px 10px;
      }

      .status-badge {
        font-size: 10px;
        padding: 3px 8px;
      }
    }
  </style>
</head>
<body>

<!-- ============================================
SIDEBAR
============================================ -->
<div class="sidebar">
  <div class="logo">💼<span>Hire<span class="dot">.</span></span></div>

  <div class="nav-section">Main</div>
  <a href="dashboard.html"><span class="icon">📊</span> Dashboard</a>
  <a href="job-list.html"><span class="icon">💼</span> Jobs</a>
  <a href="applied-jobs.html" class="active"><span class="icon">📝</span> Applied Jobs</a>
  <a href="profile.html"><span class="icon">👤</span> Profile</a>

  <div class="sidebar-footer">
    <button id="logout-btn" class="logout-btn">
      <span class="icon">🚪</span> Logout
    </button>
  </div>
</div>

<!-- ============================================
MAIN CONTENT
============================================ -->
<div class="main-content">

  <!-- Top Navbar -->
  <div class="top-navbar">
    <div class="page-title">
      <h1>📝 Applied Jobs</h1>
      <p>Track your job applications</p>
    </div>
    <div class="navbar-right">
      <div class="user-info">
        <div class="avatar" id="userAvatar">S</div>
        <span class="name" id="userName">Student</span>
      </div>
      <button id="logout-top" class="logout-top-btn">Logout</button>
    </div>
  </div>

  <!-- Stats Bar -->
  <div class="stats-bar">
    <div class="stat-item">
      <div class="stat-label">Total Applied</div>
      <div class="stat-value"><span class="highlight" id="totalApplied">0</span></div>
    </div>
    <div class="stat-item">
      <div class="stat-label">Pending Review</div>
      <div class="stat-value"><span class="highlight" id="pendingCount">0</span></div>
    </div>
    <div class="stat-item">
      <div class="stat-label">Shortlisted</div>
      <div class="stat-value"><span class="highlight" id="shortlistedCount">0</span></div>
    </div>
    <div class="stat-item">
      <div class="stat-label">Accepted</div>
      <div class="stat-value"><span class="highlight" id="acceptedCount">0</span></div>
    </div>
  </div>

  <!-- Applied Jobs Table -->
  <div class="card">
    <div class="card-header">
      <h3>📋 All Applications</h3>
      <span class="badge" id="applicationCount">0 Applications</span>
    </div>
    <div class="table-wrapper">
      <table>
        <thead>
          <tr>
            <th>Job Title</th>
            <th>Company</th>
            <th>Location</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody id="applied-jobs-body">
          <tr>
            <td colspan="4" style="text-align: center; padding: 40px; color: var(--text-muted);">
              <span style="font-size: 32px; display: block; margin-bottom: 8px;">⏳</span>
              Loading applications...
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

</div>

<!-- ============================================
SCRIPTS
============================================ -->
<script>
  // ============================================
  // CONFIGURATION
  // ============================================
  const API_URL = '/api';

  // ============================================
  // CHECK LOGIN
  // ============================================
  const token = localStorage.getItem('token');
  if (!token) {
    window.location.href = '../Auth/Login.html';
  }

  let user = {};
  try {
    user = JSON.parse(localStorage.getItem('user') || '{}') || {};
  } catch (error) {
    localStorage.removeItem('user');
  }
  document.getElementById('userName').textContent = user.username || 'Student';
  document.getElementById('userAvatar').textContent = (user.username || 'S').charAt(0).toUpperCase();

  // ============================================
  // LOGOUT
  // ============================================
  function logout() {
    localStorage.clear();
    window.location.href = '../Auth/Login.html';
  }

  document.getElementById('logout-btn').addEventListener('click', logout);
  document.getElementById('logout-top').addEventListener('click', logout);

  // ============================================
  // STATUS CONFIGURATION
  // ============================================
  const statusConfig = {
    pending: { label: 'Pending', class: 'status-pending', icon: '⏳' },
    reviewed: { label: 'Reviewed', class: 'status-reviewed', icon: '📋' },
    shortlisted: { label: 'Shortlisted', class: 'status-shortlisted', icon: '⭐' },
    interview: { label: 'Interview', class: 'status-interview', icon: '📅' },
    accepted: { label: 'Accepted', class: 'status-accepted', icon: '✅' },
    rejected: { label: 'Rejected', class: 'status-rejected', icon: '❌' }
  };

  // ============================================
  // LOAD APPLIED JOBS
  // ============================================
  async function loadAppliedJobs() {
    try {
      const token = localStorage.getItem('token');
      if (!token) return;

      const response = await fetch(`${API_URL}/student/applications`, {
        headers: { 'Authorization': `Bearer ${token}` }
      });

      if (response.status === 401) {
        window.location.href = '../Auth/Login.html';
        return;
      }

      if (!response.ok) {
        throw new Error('Failed to load applications');
      }

      const data = await response.json();
      const applications = data.applications || [];

      renderApplications(applications);
      updateStats(applications);

    } catch (error) {
      console.error('Load applied jobs error:', error);
      document.getElementById('applied-jobs-body').innerHTML = `
        <tr>
          <td colspan="4" style="text-align: center; padding: 40px; color: var(--text-muted);">
            <span style="font-size: 32px; display: block; margin-bottom: 8px;">❌</span>
            Failed to load applications. Please try again.
          </td>
        </tr>
      `;
    }
  }

  // ============================================
  // RENDER APPLICATIONS
  // ============================================
  function renderApplications(applications) {
    const tbody = document.getElementById('applied-jobs-body');

    if (!applications || applications.length === 0) {
      tbody.innerHTML = `
        <tr>
          <td colspan="4" style="padding: 0;">
            <div class="empty-state">
              <span class="icon">📭</span>
              <h3>No applications yet</h3>
              <p>You haven't applied to any jobs yet.</p>
              <a href="job-list.html" class="btn-browse">Browse Jobs →</a>
            </div>
          </td>
        </tr>
      `;
      return;
    }

    tbody.innerHTML = applications.map(app => {
      const status = app.status || 'pending';
      const config = statusConfig[status] || statusConfig.pending;
      const jobTitle = app.Job?.title || 'Unknown Job';
      const company = app.Job?.company || 'Unknown Company';
      const location = app.Job?.location || 'N/A';

      return `
        <tr>
          <td class="job-title">${jobTitle}</td>
          <td class="company-name">${company}</td>
          <td>📍 ${location}</td>
          <td>
            <span class="status-badge ${config.class}">
              <span class="dot"></span>
              ${config.icon} ${config.label}
            </span>
          </td>
        </tr>
      `;
    }).join('');
  }

  // ============================================
  // UPDATE STATS
  // ============================================
  function updateStats(applications) {
    const total = applications.length;
    document.getElementById('totalApplied').textContent = total;
    document.getElementById('applicationCount').textContent = `${total} Applications`;

    // Count by status
    const counts = {
      pending: 0,
      reviewed: 0,
      shortlisted: 0,
      interview: 0,
      accepted: 0,
      rejected: 0
    };

    applications.forEach(app => {
      const status = app.status || 'pending';
      if (counts[status] !== undefined) counts[status]++;
    });

    document.getElementById('pendingCount').textContent = counts.pending + counts.reviewed;
    document.getElementById('shortlistedCount').textContent = counts.shortlisted + counts.interview;
    document.getElementById('acceptedCount').textContent = counts.accepted;
  }

  // ============================================
  // INITIALIZE
  // ============================================
  document.addEventListener('DOMContentLoaded', function() {
    loadAppliedJobs();
  });
</script>
</body>
</html>
